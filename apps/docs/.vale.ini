; Prose linting for the docs. Run `vale docs` from apps/docs, or
; `pnpm --filter @trema/docs lint:prose` from the repo root.
; The Google package is vendored under .vale/styles; run `vale sync` to update it.
StylesPath = .vale/styles
MinAlertLevel = warning
Packages = Google
Vocab = Trema

[formats]
mdx = md

[*.{md,mdx}]
BasedOnStyles = Vale, Google, Trema

; Inline code carries literal identifiers (roles, env vars, commands); prose
; rules must not rewrite them. The raw-scoped Trema.*StartCode rules are
; unaffected by token ignores.
TokenIgnores = (`[^`\n]+`)

; Trema.TremaCase owns the Trema/trema casing check; the vocabulary would
; otherwise duplicate every alert through Vale.Terms.
Vale.Terms = NO

; Headings that are code tokens (a flag, a config field) are allowed, and the
; body may use semicolons and parentheticals where they read well.
Google.Headings = NO
Google.Parens = NO
Google.Semicolons = NO
