packages:
  - apps/*
  - packages/*

# pnpm is pinned through mise; use the executable selected on PATH instead of
# downloading and re-executing the version from package.json.
pmOnFail: ignore

# Shared dependency versions. Reference as `"typescript": "catalog:"`.
catalog:
  "@types/node": ^24.10.1
  typescript: ^7.0.2

# Lifecycle scripts are blocked by default; allow them per package.
allowBuilds:
  # Its install script only prints a version-compatibility notice.
  "@hatchet-dev/typescript-sdk": false
  "@prisma/client": false
  "@prisma/engines": true
  better-sqlite3: false
  # Its optional postinstall only integrates with Openclaw, which Trema does not use.
  ddg-search: false
  esbuild: true
  prisma: true
  # Its install script only builds the code generator we do not use.
  protobufjs: false
  sharp: true
  workerd: true

# Fail on a lockfile that does not match package.json (CI is stricter still).
strictPeerDependencies: true
