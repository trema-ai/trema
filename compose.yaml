services:
  postgres:
    # pgvector's image is stock Postgres plus the `vector` extension, which the
    # item search index needs.
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: trema
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
    ports:
      # Set by scripts/dev-env.sh (via mise) to a per-worktree port, so
      # parallel worktrees each get their own Postgres.
      - "${TREMA_DB_PORT:-5432}:5432"
    volumes:
      - trema-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d trema"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  trema-postgres:
