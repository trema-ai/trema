services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: trema
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
    ports:
      - "5432:5432"
    volumes:
      - trema-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d trema"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  trema-postgres:
