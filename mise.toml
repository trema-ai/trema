# Alias the short name so this pin overrides a global `pnpm` entry instead of
# coexisting with it as a second tool (`npm:pnpm`) that loses on PATH order.
[tool_alias]
pnpm = "npm:pnpm"

[tools]
node = "24.18.0"
pnpm = "11.15.1"
vale = "3.15.1"

[env]
# The repo root, resolved by mise; dev-env.sh needs it because BASH_SOURCE is
# unavailable in mise's env-source interpreter.
TREMA_ROOT = "{{config_root}}"
# Per-worktree dev slot and ports, so parallel worktrees don't collide.
_.source = "{{config_root}}/scripts/dev-env.sh"

[tasks."env:init"]
description = "Create apps/server/.env with generated authentication and credential secrets"
run = '''
if [ ! -f apps/server/.env ]; then
  auth_secret="$(openssl rand -base64 33)"
  credential_master_key="$(openssl rand -base64 32)"
  sed -e "s|replace-with-at-least-32-random-characters|$auth_secret|" \
      -e "s|replace-with-base64-encoded-32-byte-key|$credential_master_key|" \
      -e "s|localhost:5432|localhost:${TREMA_DB_PORT:-5432}|" \
      -e "s|^PORT=3000$|PORT=${TREMA_SERVER_PORT:-3000}|" \
      -e "s|localhost:3000|localhost:${TREMA_SERVER_PORT:-3000}|" \
      -e "s|localhost:5173|localhost:${TREMA_WEB_PORT:-5173}|" \
      apps/server/.env.example > apps/server/.env
  echo "Created apps/server/.env with generated secrets (dev slot ${TREMA_DEV_SLOT:-0})"
fi
'''

[tasks."db:up"]
description = "Start the local Postgres container"
run = '''
db_port="${TREMA_DB_PORT:-5432}"
project="${COMPOSE_PROJECT_NAME:-$(basename "$PWD")}"
holder="$(docker ps --filter publish="$db_port" | awk 'NR>1 {print $NF}' | grep -v "^$project-postgres-1$" || true)"
if [ -n "$holder" ]; then
  echo "Port $db_port is held by another container: $holder" >&2
  echo "Stop it first: docker stop $holder" >&2
  exit 1
fi
docker compose up -d --wait postgres
'''

[tasks."hatchet:up"]
description = "Start the local Hatchet engine and put its tenant token in apps/server/.env"
depends = ["env:init", "db:up"]
# The engine is a dependency of run scheduling only: without a token the server
# still serves context and says so in a warning. This task makes the local
# stack whole — engine up, token minted once, connection settings written into
# the same .env the server and worker read.
run = '''
env_file="apps/server/.env"
# hatchet-lite keeps its state in its own database on this worktree's Postgres,
# and the image does not create it.
if ! docker compose exec -T postgres psql -U postgres -tAc \
  "SELECT 1 FROM pg_database WHERE datname = 'hatchet'" | grep -q 1; then
  docker compose exec -T postgres createdb -U postgres hatchet
fi
docker compose up -d hatchet

if grep -q "^HATCHET_CLIENT_TOKEN=." "$env_file"; then
  echo "Hatchet is up on http://localhost:${TREMA_HATCHET_PORT:-8888} (token already in $env_file)"
  exit 0
fi

# The tenant hatchet-lite seeds on first boot. Minting is also the readiness
# check: the admin binary only issues a token once the database is migrated.
tenant="707d0855-80ab-4e1f-a156-f1c4546cbf52"
echo "Waiting for Hatchet to issue a tenant token..."
token=""
i=0
while [ "$i" -lt 60 ]; do
  candidate="$(docker compose exec -T hatchet /hatchet-admin token create \
    --config /config --tenant-id "$tenant" 2>/dev/null | tr -d '\r' | tail -n 1)"
  case "$candidate" in
  ey*)
    token="$candidate"
    break
    ;;
  esac
  i=$((i + 1))
  sleep 2
done
if [ -z "$token" ]; then
  echo "Hatchet did not issue a token. Check: docker compose logs hatchet" >&2
  exit 1
fi

# The token carries the broadcast address, but the host and TLS strategy are
# written out too so the settings are visible where every other one lives.
# Rewriting strips any previous block first, so the file does not grow a stale
# copy every time the stack is rebuilt.
tmp="$(mktemp)"
rest="$(grep -v -e "^# Hatchet, written by" -e "^HATCHET_CLIENT_TOKEN=" \
  -e "^HATCHET_CLIENT_HOST_PORT=" -e "^HATCHET_CLIENT_TLS_STRATEGY=" "$env_file")"
{
  printf '%s\n\n' "$rest"
  echo "# Hatchet, written by \`mise run hatchet:up\` for dev slot ${TREMA_DEV_SLOT:-0}."
  echo "HATCHET_CLIENT_TOKEN=$token"
  echo "HATCHET_CLIENT_HOST_PORT=localhost:${TREMA_HATCHET_GRPC_PORT:-7077}"
  echo "HATCHET_CLIENT_TLS_STRATEGY=none"
} > "$tmp"
mv "$tmp" "$env_file"
echo "Hatchet is up: dashboard http://localhost:${TREMA_HATCHET_PORT:-8888}, gRPC localhost:${TREMA_HATCHET_GRPC_PORT:-7077}"
'''

[tasks."dev:clean"]
description = "Tear down this worktree's dev stack: containers, network, and data volumes"
run = '''
project="${COMPOSE_PROJECT_NAME:-$(basename "$PWD")}"
echo "Removing compose project '$project' (dev slot ${TREMA_DEV_SLOT:-0}), including its database volume"
docker compose down --volumes --remove-orphans
# The Hatchet tenant went with the volumes, so its token is dead. Dropping it
# keeps the next `mise run dev` from trying to reuse it.
env_file="apps/server/.env"
if [ -f "$env_file" ] && grep -q "^HATCHET_CLIENT_TOKEN=" "$env_file"; then
  tmp="$(mktemp)"
  printf '%s\n' "$(grep -v -e "^# Hatchet, written by" -e "^HATCHET_CLIENT_TOKEN=" \
    -e "^HATCHET_CLIENT_HOST_PORT=" -e "^HATCHET_CLIENT_TLS_STRATEGY=" "$env_file")" > "$tmp"
  mv "$tmp" "$env_file"
  echo "Cleared the Hatchet connection settings from $env_file"
fi
echo "Done. apps/server/.env is kept; delete it too if you are re-slotting this worktree."
'''

[tasks.test]
description = "Run the full test suite against this worktree's dedicated trema_test database"
depends = ["db:up"]
run = '''
export TEST_DATABASE_URL="postgresql://postgres:postgres@localhost:${TREMA_DB_PORT:-5432}/trema_test"
mise exec -- pnpm -r test
'''

[tasks."db:migrate"]
description = "Apply pending migrations to the local database"
depends = ["env:init", "db:up"]
# `migrate deploy` (unlike `migrate dev`) never generates the client, and the
# generated client is gitignored — generate here so a fresh checkout works.
run = [
  "pnpm --filter @trema/server exec prisma migrate deploy",
  "pnpm --filter @trema/server exec prisma generate",
]

[tasks.seed]
description = "Seed the local database with development accounts"
depends = ["db:migrate"]
run = "pnpm --filter @trema/server exec tsx --conditions=development scripts/seed-dev.ts"

[tasks."dev:server"]
description = "Run the API server in watch mode"
depends = ["db:migrate", "hatchet:up"]
run = "pnpm --filter @trema/server dev"

[tasks."dev:worker"]
description = "Run the run worker in watch mode"
depends = ["db:migrate", "hatchet:up"]
run = "pnpm --filter @trema/server dev:worker"

[tasks."dev:web"]
description = "Run the web app dev server"
run = "pnpm --filter @trema/web dev"

[tasks.dev]
description = "Start Postgres and Hatchet, apply migrations, and run the server, worker, and web app in watch mode"
depends = ["dev:server", "dev:worker", "dev:web"]
