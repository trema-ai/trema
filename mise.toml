# Alias the short name so this pin overrides a global `pnpm` entry instead of
# coexisting with it as a second tool (`npm:pnpm`) that loses on PATH order.
[tool_alias]
pnpm = "npm:pnpm"

[tools]
node = "24.18.0"
pnpm = "11.15.1"
vale = "3.15.1"

[env]
# The repo root, resolved by mise; dev-env.sh needs it because BASH_SOURCE is
# unavailable in mise's env-source interpreter.
TREMA_ROOT = "{{config_root}}"
# Per-worktree dev slot and ports, so parallel worktrees don't collide.
_.source = "{{config_root}}/scripts/dev-env.sh"

[tasks."env:init"]
description = "Create apps/server/.env with generated authentication and credential secrets"
run = '''
if [ ! -f apps/server/.env ]; then
  auth_secret="$(openssl rand -base64 33)"
  credential_master_key="$(openssl rand -base64 32)"
  sed -e "s|replace-with-at-least-32-random-characters|$auth_secret|" \
      -e "s|replace-with-base64-encoded-32-byte-key|$credential_master_key|" \
      -e "s|localhost:5432|localhost:${TREMA_DB_PORT:-5432}|" \
      -e "s|^PORT=3000$|PORT=${TREMA_SERVER_PORT:-3000}|" \
      -e "s|localhost:3000|localhost:${TREMA_SERVER_PORT:-3000}|" \
      -e "s|localhost:5173|localhost:${TREMA_WEB_PORT:-5173}|" \
      apps/server/.env.example > apps/server/.env
  echo "Created apps/server/.env with generated secrets (dev slot ${TREMA_DEV_SLOT:-0})"
fi
'''

[tasks."db:up"]
description = "Start the local Postgres container"
run = '''
db_port="${TREMA_DB_PORT:-5432}"
project="${COMPOSE_PROJECT_NAME:-$(basename "$PWD")}"
holder="$(docker ps --filter publish="$db_port" | awk 'NR>1 {print $NF}' | grep -v "^$project-postgres-1$" || true)"
if [ -n "$holder" ]; then
  echo "Port $db_port is held by another container: $holder" >&2
  echo "Stop it first: docker stop $holder" >&2
  exit 1
fi
docker compose up -d --wait postgres
'''

[tasks."dev:clean"]
description = "Tear down this worktree's dev stack: Postgres container, network, and data volume"
run = '''
project="${COMPOSE_PROJECT_NAME:-$(basename "$PWD")}"
echo "Removing compose project '$project' (dev slot ${TREMA_DEV_SLOT:-0}), including its database volume"
docker compose down --volumes --remove-orphans
echo "Done. apps/server/.env is kept; delete it too if you are re-slotting this worktree."
'''

[tasks.test]
description = "Run the full test suite against this worktree's dedicated trema_test database"
depends = ["db:up"]
run = '''
export TEST_DATABASE_URL="postgresql://postgres:postgres@localhost:${TREMA_DB_PORT:-5432}/trema_test"
mise exec -- pnpm -r test
'''

[tasks."db:migrate"]
description = "Apply pending migrations to the local database"
depends = ["env:init", "db:up"]
run = "pnpm --filter @trema/server exec prisma migrate deploy"

[tasks.seed]
description = "Seed the local database with development accounts"
depends = ["db:migrate"]
run = "pnpm --filter @trema/server exec tsx scripts/seed-dev.ts"

[tasks."dev:server"]
description = "Run the API server in watch mode"
depends = ["db:migrate"]
run = "pnpm --filter @trema/server dev"

[tasks."dev:web"]
description = "Run the web app dev server"
run = "pnpm --filter @trema/web dev"

[tasks.dev]
description = "Start Postgres, apply migrations, and run the server and web app in watch mode"
depends = ["dev:server", "dev:web"]
